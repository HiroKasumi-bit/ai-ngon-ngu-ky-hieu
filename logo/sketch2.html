<!doctype html>

<body>
<!-- D: two cupped hands, monoline fingers -->

<svg viewBox="0 0 512 512">

    <path d="M112 236 C118 300 170 336 246 342"/>
    <path d="M128 282 C142 332 186 360 246 366"/>
    <path d="M150 324 C168 362 204 384 246 390"/>
    <path d="M176 362 C196 392 220 406 246 410"/>

    <path d="M112 236 C110 208 124 186 150 176"/>
    <!-- right hand (mirror) -->
    <path d="M400 236 C394 300 342 336 266 342"/>
    <path d="M384 282 C370 332 326 360 266 366"/>
    <path d="M362 324 C344 362 308 384 266 390"/>
    <path d="M336 362 C316 392 292 406 266 410"/>

  <path fill="#FFB547" d="M256 214 a46 46 0 1 1 -33 79 l-23 11 l9 -25 a46 46 0 0 1 47 -65z"/>

<figcaption>D · đôi tay chụm nâng lời nói (nét)</figcaption>
</figure>

<figure>
<svg viewBox="0 0 512 512">

    <!-- thumb resting along rim -->
    <path d="M120 300 C108 262 118 226 150 214 C168 208 184 218 184 234" stroke-width="22"/>
    <!-- fingers curling up, staggered -->
    <path d="M380 330 C404 300 410 262 396 228" stroke-width="22"/>
    <path d="M352 352 C384 330 400 296 394 262" stroke-width="18" opacity=".55"/>
    <path d="M396 228 C390 214 376 210 366 218" stroke-width="22"/>
  </g>
  <path fill="#FFB547" d="M262 236 a44 44 0 1 1 -32 76 l-22 10 l9 -24 a44 44 0 0 1 45 -62z"/>
</svg>
<figcaption>E · một bàn tay khum (nét)</figcaption>
</figure>

<!-- F: D filled, softer, palms as two leaves -->
<figure>
<svg viewBox="0 0 512 512">
  <path fill="#3B2A5C" d="M98 226 C92 196 112 172 140 168 C150 168 156 178 152 190 C146 214 150 236 160 256 C186 306 222 330 248 334 L248 420 C176 418 116 360 98 226Z"/>

</body></html>
