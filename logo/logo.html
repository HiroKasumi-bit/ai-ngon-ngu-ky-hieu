<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--plum:#3B2A5C;--sun:#FFB547;--blush:#FBEFEA;--rose:#F3D5CC}
  body{margin:0;width:1600px;height:900px;background:#F6F1EE;font-family:"Quicksand",sans-serif;color:var(--plum);
       display:grid;grid-template-columns:520px 1fr;grid-template-rows:1fr 1fr;gap:36px;padding:48px;box-sizing:border-box}
  .card{border-radius:32px;display:flex;align-items:center;justify-content:center}
  .big{grid-row:1/3;background:var(--blush)}
  .row{display:flex;gap:36px}
  .icon{width:300px;height:300px;border-radius:68px;display:flex;align-items:center;justify-content:center}
  .lockup{flex:1;background:#fff;border-radius:32px;display:flex;align-items:center;gap:28px;padding:0 48px}
  .word{font-size:96px;font-weight:700;letter-spacing:-.01em;line-height:1}
  .tag{font-size:30px;font-weight:500;opacity:.75;margin-top:10px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="mark" viewBox="0 0 512 512">
      <!-- left hand -->
      <path fill="var(--h)" d="M96 214 C90 182 110 160 138 158 C152 158 160 170 154 184 C146 206 150 232 162 254 C188 304 222 328 246 332 L246 424 C172 420 114 360 96 214Z"/>
      <!-- right hand -->
      <path fill="var(--h)" d="M416 214 C422 182 402 160 374 158 C360 158 352 170 358 184 C366 206 362 232 350 254 C324 304 290 328 266 332 L266 424 C340 420 398 360 416 214Z"/>
      <!-- finger lines -->
      <g stroke="var(--l)" fill="none" stroke-linecap="round" stroke-width="8">
        <path d="M124 296 C156 336 202 360 246 366"/>
        <path d="M146 342 C176 370 212 386 246 392"/>
        <path d="M388 296 C356 336 310 360 266 366"/>
        <path d="M366 342 C336 370 300 386 266 392"/>
      </g>
      <!-- the word being held -->
      <path fill="var(--w)" d="M256 168 C298 168 330 196 330 234 C330 272 298 298 258 298 C246 298 236 296 228 292 L196 304 L208 278 C192 266 182 250 182 234 C182 196 214 168 256 168Z"/>
      <g fill="var(--d)"><circle cx="228" cy="234" r="9"/><circle cx="256" cy="234" r="9"/><circle cx="284" cy="234" r="9"/></g>
    </symbol>
  </defs>
</svg>
<style>
  .on-light{--h:var(--plum);--l:var(--blush);--w:var(--sun);--d:var(--plum)}
  .on-white{--h:var(--plum);--l:#fff;--w:var(--sun);--d:var(--plum)}
  .on-dark{--h:var(--blush);--l:var(--plum);--w:var(--sun);--d:var(--plum)}
  .on-sun{--h:var(--plum);--l:var(--sun);--w:#fff;--d:var(--plum)}
</style>

<div class="card big on-light"><svg width="440" height="440"><use href="#mark"/></svg></div>

<div class="row">
  <div class="icon on-dark" style="background:var(--plum)"><svg width="230" height="230"><use href="#mark"/></svg></div>
  <div class="icon on-light" style="background:var(--rose)"><svg width="230" height="230"><use href="#mark"/></svg></div>
  <div class="icon on-sun" style="background:var(--sun)"><svg width="230" height="230"><use href="#mark"/></svg></div>
</div>

<div class="lockup on-white">
  <svg width="210" height="210"><use href="#mark"/></svg>
  <div><div class="word">Lời Tay</div><div class="tag">hiểu nhau từ đôi tay</div></div>
</div>
</body></html>
