<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  body{margin:0;width:1600px;height:600px;background:#f4f1ee;display:flex;gap:40px;align-items:center;justify-content:center;font-family:sans-serif}
  figure{margin:0;text-align:center}
  figcaption{margin-top:10px;font-size:18px;color:#555}
  svg{width:460px;height:460px;background:#FBF3EF;border-radius:28px}
</style></head>
<body>
<!-- A: cupped hand cradling a word (filled) -->
<figure>
<svg viewBox="0 0 512 512">
  <path fill="#3B2A5C" d="M152 182 C176 176 192 196 190 220 L186 262 C190 300 222 322 262 322 C300 322 330 304 344 270 L356 214 C360 190 392 186 398 210 C420 300 400 380 330 404 C270 424 190 410 150 360 C120 320 120 250 130 210 C134 192 140 184 152 182Z"/>
  <g stroke="#FBF3EF" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M372 236 C384 232 396 236 404 246"/>
    <path d="M366 268 C380 264 394 268 404 280"/>
  </g>
  <path fill="#FFB547" d="M262 218 a42 42 0 1 1 -30 72 l-20 10 l8 -22 a42 42 0 0 1 42 -60z"/>
</svg>
<figcaption>A · tay khum nâng một lời nói</figcaption>
</figure>

<!-- B: two hands, one signing one receiving, meeting -->
<figure>
<svg viewBox="0 0 512 512">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- lower open palm (receiving), stroke -->
    <path d="M110 330 C170 392 330 392 400 320" stroke="#3B2A5C" stroke-width="40"/>
    <path d="M400 320 C418 300 424 280 420 262" stroke="#3B2A5C" stroke-width="40"/>
    <path d="M110 330 C96 314 92 296 98 280" stroke="#3B2A5C" stroke-width="40"/>
    <!-- upper hand resting gently, fingertips touching palm -->
    <path d="M300 128 C268 170 252 214 256 262" stroke="#E07A6F" stroke-width="40"/>
    <path d="M340 150 C310 188 296 226 298 268" stroke="#E07A6F" stroke-width="40"/>
    <path d="M232 170 C220 196 214 222 216 252" stroke="#E07A6F" stroke-width="36"/>
  </g>
  <circle cx="258" cy="306" r="14" fill="#FFB547"/>
</svg>
<figcaption>B · hai bàn tay chạm khẽ</figcaption>
</figure>

<!-- C: open palm with speech-bubble negative space -->
<figure>
<svg viewBox="0 0 512 512">
  <g fill="#3B2A5C">
    <rect x="150" y="230" width="210" height="200" rx="90"/>
    <g stroke="#3B2A5C" stroke-linecap="round">
      <line x1="186" y1="250" x2="176" y2="120" stroke-width="50"/>
      <line x1="242" y1="240" x2="242" y2="96" stroke-width="52"/>
      <line x1="298" y1="244" x2="310" y2="112" stroke-width="50"/>
      <line x1="342" y1="268" x2="368" y2="170" stroke-width="44"/>
      <line x1="168" y1="350" x2="104" y2="282" stroke-width="50"/>
    </g>
  </g>
  <path fill="#FBF3EF" d="M256 296 a44 44 0 1 1 -32 74 l-22 10 l9 -23 a44 44 0 0 1 45 -61z"/>
</svg>
<figcaption>C · lòng bàn tay chứa lời nói</figcaption>
</figure>
</body></html>
