[project]
name = "vsl-ai"
version = "0.1.0"
description = "Nhận diện ngôn ngữ ký hiệu Việt Nam: trích điểm tay/vai bằng MediaPipe, train model nhỏ, xuất cho web"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-python",
  "numpy",
  "pandas",
  "scikit-learn",
  "pytest",
  "pyarrow>=26.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
